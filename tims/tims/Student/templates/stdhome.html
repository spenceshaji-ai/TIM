{% load static %}
{% include 'stdheader.html' %}

<div class="content">
    <div class="container-fluid">

        <style>
            .student-welcome-page {
                min-height: calc(100vh - 120px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
                background:
                    radial-gradient(circle at top left, rgba(13, 110, 253, 0.15), transparent 35%),
                    radial-gradient(circle at bottom right, rgba(255, 193, 7, 0.15), transparent 35%),
                    linear-gradient(135deg, #f8fbff 0%, #eef5ff 50%, #fffdf6 100%);
                border-radius: 20px;
                position: relative;
            }

            .student-welcome-content {
                text-align: center;
                max-width: 800px;
                padding: 50px 20px;
            }

            .student-title {
                font-size: clamp(36px, 6vw, 64px);
                font-weight: 800;
                color: #102033;
                margin-bottom: 20px;
            }

            .student-name {
                color: #0d6efd;
            }

            .student-subtitle {
                font-size: 18px;
                color: #6c757d;
                line-height: 1.7;
                max-width: 600px;
                margin: auto;
            }

            .student-emoji {
                font-size: 50px;
                margin-bottom: 15px;
            }

            @media (max-width: 768px) {
                .student-subtitle {
                    font-size: 16px;
                }
            }
        </style>

        <div class="student-welcome-page">
            <div class="student-welcome-content">

                <div class="student-emoji">🎓</div>

                <h1 class="student-title">
                    Welcome,
                    <span class="student-name">
                        {% if user.name %}
                            {{ user.name }}
                        {% else %}
                            {{ user.username }}
                        {% endif %}
                    </span>
                    👋
                </h1>

                <p class="student-subtitle">
                    Start learning, explore your courses, and track your progress 
                    in a simple and focused environment.
                </p>

            </div>
        </div>

    </div>
</div>

{% include 'stdfooter.html' %}
